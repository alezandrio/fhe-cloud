version: "3.8"

services:

  server:
    build: ./hospital_node      
    working_dir: /app
    volumes:
      - ./server:/app
    command: ["python", "server.py"]
    ports:
      - "8080:8080"
    networks:
      - fl_network

  hospital_1:
    build: ./hospital_node
    environment:
      - SERVER_ADDRESS=server:8080
      - CLIENT_ID=0
      - NUM_CLIENTS=3
      - PARTITION_MODE=dirichlet
      - DIRICHLET_ALPHA=0.5
    volumes:
      - mnist_data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    depends_on:
      - server
    networks:
      - fl_network

  hospital_2:
    build: ./hospital_node
    environment:
      - SERVER_ADDRESS=server:8080
      - CLIENT_ID=1
      - NUM_CLIENTS=3
    volumes:
      - mnist_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    depends_on:
      - server
    networks:
      - fl_network

  hospital_3:
    build: ./hospital_node
    environment:
      - SERVER_ADDRESS=server:8080
      - CLIENT_ID=2
      - NUM_CLIENTS=3
    volumes:
      - mnist_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
    depends_on:
      - server
    networks:
      - fl_network

networks:
  fl_network:

volumes:
  mnist_data: